<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" width="600" height="680" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#2a1f6b"/>
      <stop offset="60%" stop-color="#120d3a"/>
      <stop offset="100%" stop-color="#070520"/>
    </radialGradient>
    <linearGradient id="nova" x1="215" y1="190" x2="385" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="ring" x1="85" y1="280" x2="515" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="word" x1="150" y1="0" x2="450" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="55%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#f9a8d4"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="disc"><circle cx="300" cy="280" r="250"/></clipPath>
  </defs>

  <!-- planet disc -->
  <circle cx="300" cy="280" r="250" fill="url(#bg)"/>
  <circle cx="300" cy="280" r="250" fill="none" stroke="url(#nova)" stroke-width="4" opacity="0.8"/>

  <g clip-path="url(#disc)">
    <!-- nebula clouds -->
    <ellipse cx="190" cy="170" rx="120" ry="70" fill="#7c3aed" opacity="0.22" filter="url(#glow)"/>
    <ellipse cx="420" cy="400" rx="130" ry="70" fill="#0ea5e9" opacity="0.2" filter="url(#glow)"/>
    <ellipse cx="400" cy="150" rx="80" ry="45" fill="#ec4899" opacity="0.16" filter="url(#glow)"/>

    <!-- spiral galaxy arms -->
    <g transform="rotate(-24 300 280)" fill="none" stroke-linecap="round">
      <path d="M300 280 C 330 230, 410 240, 430 300 C 445 355, 380 410, 310 395" stroke="#a78bfa" stroke-width="3" opacity="0.35"/>
      <path d="M300 280 C 270 330, 190 320, 170 260 C 155 205, 220 150, 290 165" stroke="#7dd3fc" stroke-width="3" opacity="0.35"/>
    </g>

    <!-- stars -->
    <g fill="#ffffff">
      <circle cx="120" cy="120" r="2"/><circle cx="170" cy="75" r="1.5"/>
      <circle cx="250" cy="60" r="2.2"/><circle cx="330" cy="48" r="1.4"/>
      <circle cx="450" cy="90" r="2"/><circle cx="500" cy="170" r="1.6"/>
      <circle cx="530" cy="260" r="1.4"/><circle cx="505" cy="360" r="2"/>
      <circle cx="455" cy="455" r="1.6"/><circle cx="360" cy="505" r="2.2"/>
      <circle cx="245" cy="500" r="1.5"/><circle cx="150" cy="450" r="2"/>
      <circle cx="85" cy="360" r="1.5"/><circle cx="70" cy="240" r="2.2"/>
      <circle cx="205" cy="125" r="1.2"/><circle cx="470" cy="300" r="1.2"/>
      <circle cx="135" cy="320" r="1.2"/><circle cx="395" cy="465" r="1.2"/>
    </g>
  </g>

  <!-- orbit ring: back half -->
  <g transform="rotate(-24 300 280)" fill="none" stroke-linecap="round">
    <path d="M85 280 A215 62 0 0 1 515 280" stroke="url(#ring)" stroke-width="5" opacity="0.55"/>
  </g>

  <!-- letter N -->
  <path d="M215 370 L215 190 L385 370 L385 190" fill="none" stroke="url(#nova)" stroke-width="40"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M215 370 L215 190 L385 370 L385 190" fill="none" stroke="#ffffff" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>

  <!-- orbit ring: front half -->
  <g transform="rotate(-24 300 280)" fill="none" stroke-linecap="round">
    <path d="M85 280 A215 62 0 0 0 515 280" stroke="url(#ring)" stroke-width="7" filter="url(#glow)"/>
    <circle cx="468" cy="305" r="9" fill="#f9a8d4" filter="url(#glow)"/>
  </g>

  <!-- nova star burst -->
  <g filter="url(#glow)">
    <path d="M385 120 Q394 181 455 190 Q394 199 385 260 Q376 199 315 190 Q376 181 385 120 Z" fill="#ffffff"/>
  </g>
  <circle cx="385" cy="190" r="9" fill="#ffffff"/>

  <!-- wordmark -->
  <text x="300" y="598" text-anchor="middle" font-family="Orbitron, 'Segoe UI', Arial, sans-serif"
        font-size="72" font-weight="800" letter-spacing="20" fill="url(#word)">NOVA</text>
  <text x="300" y="645" text-anchor="middle" font-family="Orbitron, 'Segoe UI', Arial, sans-serif"
        font-size="24" font-weight="600" letter-spacing="14" fill="#a5b4fc">CLIENT</text>
</svg>
